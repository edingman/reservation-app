<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Room Display</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.min.css">
  <style>
    :root {
      --red: #FF2F00;
      --teal: #0093A3;
      --white: #FFFFFF;
      --black: #000000;
      --stone: #ACA19A;
      --stone-light: #D6CFC9;
      --font-sans: 'Geist', -apple-system, sans-serif;
      --font-mono: 'Geist Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: var(--font-sans);
      background: var(--black);
      color: var(--white);
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .display-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 32px;
    }

    .display-room-name {
      font-size: 2rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.02em;
    }

    .display-clock {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      color: var(--stone);
    }

    /* Status Banner */
    .display-status {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      transition: background 500ms ease;
    }

    .display-status.available { background: var(--teal); }
    .display-status.occupied { background: var(--red); }

    .display-status-text {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 0.05em;
    }

    .display-status-sub {
      font-size: 1.5rem;
      margin-top: 8px;
      opacity: 0.9;
    }

    .display-status-detail {
      font-family: var(--font-mono);
      font-size: 1rem;
      margin-top: 16px;
      opacity: 0.7;
    }

    /* Bottom: schedule + QR */
    .display-bottom {
      background: #111;
      padding: 24px 32px;
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }

    .display-schedule {
      flex: 1;
    }

    .display-schedule h3 {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--stone);
      margin-bottom: 12px;
    }

    .display-schedule-item {
      display: flex;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #222;
      gap: 16px;
    }

    .schedule-item-time {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--stone);
      width: 120px;
      flex-shrink: 0;
    }

    .schedule-item-name {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .schedule-item-desc {
      font-size: 0.8rem;
      color: var(--stone);
      margin-left: auto;
    }

    .schedule-item-current {
      color: var(--red);
    }

    .schedule-item-current .schedule-item-time { color: var(--red); }

    .display-qr {
      text-align: center;
      flex-shrink: 0;
    }

    .display-qr img {
      width: 140px;
      height: 140px;
      border-radius: 12px;
    }

    .display-qr p {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--stone);
      margin-top: 8px;
    }

    .no-bookings {
      color: var(--stone);
      font-size: 0.9rem;
      padding: 12px 0;
    }

    /* Loading */
    .display-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--stone);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #333;
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 600ms linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Book Now Button */
    .book-now-btn {
      margin-top: 24px;
      padding: 16px 48px;
      font-size: 1.3rem;
      font-weight: 700;
      font-family: var(--font-sans);
      letter-spacing: 0.05em;
      background: var(--white);
      color: var(--teal);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease;
    }
    .book-now-btn:hover { transform: scale(1.04); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .book-now-btn:active { transform: scale(0.98); }

    /* Booking Overlay */
    .booking-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .booking-overlay.open { display: flex; }

    .booking-panel {
      background: #1a1a1a;
      border-radius: 20px;
      padding: 40px;
      width: 480px;
      max-width: 90vw;
      text-align: center;
    }

    .booking-panel h2 {
      font-size: 1.8rem;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .booking-panel .panel-sub {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--stone);
      margin-bottom: 28px;
    }

    /* Duration buttons */
    .duration-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .duration-btn {
      padding: 18px 12px;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: var(--font-sans);
      background: #2a2a2a;
      color: var(--white);
      border: 2px solid #333;
      border-radius: 12px;
      cursor: pointer;
      transition: all 150ms ease;
    }
    .duration-btn:hover:not(:disabled) { border-color: var(--teal); background: #333; }
    .duration-btn.selected { border-color: var(--teal); background: var(--teal); color: var(--white); }
    .duration-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .duration-btn .dur-label { font-size: 0.75rem; font-weight: 400; color: var(--stone); margin-top: 2px; }
    .duration-btn.selected .dur-label { color: rgba(255,255,255,0.8); }

    /* Name input step */
    .name-step { display: none; }
    .name-step.visible { display: block; }

    .name-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.1rem;
      font-family: var(--font-sans);
      background: #2a2a2a;
      color: var(--white);
      border: 2px solid #333;
      border-radius: 12px;
      outline: none;
      text-align: center;
      margin-bottom: 16px;
    }
    .name-input:focus { border-color: var(--teal); }
    .name-input::placeholder { color: #555; }

    .confirm-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: var(--font-sans);
      background: var(--teal);
      color: var(--white);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 150ms ease;
    }
    .confirm-btn:hover { opacity: 0.9; }
    .confirm-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .cancel-link {
      display: inline-block;
      margin-top: 16px;
      font-size: 0.9rem;
      color: var(--stone);
      cursor: pointer;
      border: none;
      background: none;
      font-family: var(--font-sans);
    }
    .cancel-link:hover { color: var(--white); }
  </style>
</head>
<body>

  <div class="display-loading" id="loading">
    <div style="text-align:center">
      <div class="spinner"></div>
      <p>Loading room display...</p>
    </div>
  </div>

  <div id="app" style="display:none;height:100%;display:none;flex-direction:column">
    <div class="display-top">
      <div class="display-room-name" id="d-room-name"></div>
      <div class="display-clock" id="d-clock"></div>
    </div>

    <div class="display-status" id="d-status">
      <div class="display-status-text" id="d-status-text"></div>
      <div class="display-status-sub" id="d-status-sub"></div>
      <div class="display-status-detail" id="d-status-detail"></div>
      <button class="book-now-btn" id="d-book-now" style="display:none">BOOK NOW</button>
    </div>

    <!-- Booking Overlay -->
    <div class="booking-overlay" id="booking-overlay">
      <div class="booking-panel">
        <h2>Book This Room</h2>
        <div class="panel-sub" id="overlay-room-name"></div>

        <!-- Step 1: Duration -->
        <div id="duration-step">
          <div class="duration-grid" id="duration-grid"></div>
        </div>

        <!-- Step 2: Name -->
        <div class="name-step" id="name-step">
          <input type="text" class="name-input" id="booker-name" placeholder="Your name (optional)">
          <button class="confirm-btn" id="confirm-book-btn">Confirm</button>
        </div>

        <button class="cancel-link" id="cancel-booking">Cancel</button>
      </div>
    </div>

    <div class="display-bottom">
      <div class="display-schedule">
        <h3>Upcoming</h3>
        <div id="d-schedule"></div>
      </div>
      <div class="display-qr">
        <img id="d-qr" src="" alt="QR Code">
        <p>Scan to book</p>
      </div>
    </div>
  </div>

  <script src="/js/display-page.js"></script>
</body>
</html>
